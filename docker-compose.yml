name: service-control-swissgeo
services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - source: ${PWD}/.volumes/postgresql
        target: /var/lib/postgresql
        type: bind
        bind:
          create_host_path: true
    ports:
      - "${DB_PORT}:5432"

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy

  cognito:
    image: jagregory/cognito-local:latest
    environment:
      - COGNITO_POOL_ID=${COGNITO_POOL_ID}
    volumes:
      - source: ${PWD}/.volumes/cognito
        target: /app/.cognito
        type: bind
        bind:
          create_host_path: true
      - source: ${PWD}/docker/default-pool.json
        target: /app/default-pool.json
        type: bind
    ports:
      - "${COGNITO_PORT}:9229"
    # add an empty user pool json if not already existing, then run the service
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /app/.cognito/db
        if [ ! -f "/app/.cognito/db/${COGNITO_POOL_ID}.json" ]; then
          cp /app/default-pool.json "/app/.cognito/db/${COGNITO_POOL_ID}.json"
        fi
        exec node /app/start.js

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: --config otel-local-config.yaml
    volumes:
      - ./docker/otel-local-config.yaml:/otel-local-config.yaml
    ports:
      - "4317:4317"
      - "9464:9464"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
volumes:
  opensearch-data:
