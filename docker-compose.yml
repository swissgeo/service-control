name: service-control-swissgeo
services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - source: ${PWD}/.volumes/postgresql
        target: /var/lib/postgresql
        type: bind
        bind:
          create_host_path: true
    ports:
      - "${DB_PORT}:5432"

  moto-server:
    image: motoserver/moto
    container_name: moto-server
    ports:
      - "${MOTO_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - source: ${PWD}/.volumes/minio
        target: /data
        type: bind
        bind:
          create_host_path: true

  # FIXME: replace with moto-server
  cognito:
    image: jagregory/cognito-local:latest
    environment:
      - COGNITO_POOL_ID=${COGNITO_POOL_ID}
    volumes:
      - source: ${PWD}/.volumes/cognito
        target: /app/.cognito
        type: bind
        bind:
          create_host_path: true
      - source: ${PWD}/docker/default-pool.json
        target: /app/default-pool.json
        type: bind
    ports:
      - "${COGNITO_PORT}:9229"
    # add an empty user pool json if not already existing, then run the service
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /app/.cognito/db
        if [ ! -f "/app/.cognito/db/${COGNITO_POOL_ID}.json" ]; then
          cp /app/default-pool.json "/app/.cognito/db/${COGNITO_POOL_ID}.json"
        fi
        exec node /app/start.js

  init-s3:
    image: amazon/aws-cli
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws s3api list-buckets --endpoint-url http://moto-server:5000 >/dev/null 2>&1; do
          echo "Waiting for moto-server..."; sleep 2
        done
        aws s3api create-bucket \
          --bucket ${OA_RECORDS_LOCAL_BUCKET} \
          --endpoint-url http://moto-server:5000 \
          --create-bucket-configuration LocationConstraint=${AWS_REGION} || true
        aws s3api put-bucket-policy \
          --bucket ${OA_RECORDS_LOCAL_BUCKET} \
          --endpoint-url http://moto-server:5000 \
          --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::${OA_RECORDS_LOCAL_BUCKET}/*"}]}'
        aws s3api create-bucket \
          --bucket ${OA_STYLES_LOCAL_BUCKET} \
          --endpoint-url http://moto-server:5000 \
          --create-bucket-configuration LocationConstraint=${AWS_REGION} || true
        aws s3api put-bucket-policy \
          --bucket ${OA_STYLES_LOCAL_BUCKET} \
          --endpoint-url http://moto-server:5000 \
          --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::${OA_STYLES_LOCAL_BUCKET}/*"}]}'
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}

  nginx:
    image: nginx
    ports:
      - "5001:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - moto-server

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: --config otel-local-config.yaml
    volumes:
      - ./docker/otel-local-config.yaml:/otel-local-config.yaml
    ports:
      - "4317:4317"
      - "9464:9464"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
