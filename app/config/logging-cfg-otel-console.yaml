version: 1
disable_existing_loggers: False

root:
  handlers:
    - otel
    - console
  level: INFO
  propagate: True

loggers:
  django.request:
    # setting this to ERROR prevents from logging too much
    # we do the logging ourselves
    level: ERROR

formatters:
  standard:
    format: "[%(asctime)s] %(levelname)-8s - %(name)-26s : %(message)s"

handlers:
  otel:
    (): utils.otel.get_otel_handler
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout
