version: 1
disable_existing_loggers: False

root:
  handlers:
    - console
  level: INFO
  propagate: True

# configure loggers per app
loggers:
  django.request:
    # setting this to ERROR prevents from logging too much
    level: ERROR

formatters:
  standard:
    format: "[%(asctime)s] %(levelname)-8s - %(name)-26s : %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

